<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" font-family="Roboto, Arial, sans-serif">
  <title>Sorun bildir (#26) — wireframe, normal tema: form ve gönderim sonrası</title>
  <g id="Form">
    <rect width="360" height="800" fill="#FFFFFF"/>
    <g id="Baslik">
      <path d="M16 28 L28 16 M16 28 L28 40 M16 28 L40 28" stroke="#1A1C1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="56" y="36" font-size="20" font-weight="600" fill="#1A1C1E">Sorun bildir</text>
      <line x1="0" y1="56" x2="360" y2="56" stroke="#80868F"/>
    </g>
    <g id="Nokta">
      <rect x="16" y="72" width="328" height="72" rx="12" fill="#F3F5F8" stroke="#80868F"/>
      <path d="M36 124 L60 96" stroke="#1A1C1E" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="102" font-size="20" font-weight="600" fill="#1A1C1E">Ana giriş rampası</text>
      <text x="76" y="126" font-size="16" fill="#4A5058">Rampa · Teknoloji Fakültesi</text>
    </g>
    <g id="Durum">
      <text x="16" y="182" font-size="20" font-weight="600" fill="#1A1C1E">Durum</text>
      <g id="Arizali (secili)">
        <circle cx="32" cy="216" r="10" fill="none" stroke="#0B57D0" stroke-width="2.5"/>
        <circle cx="32" cy="216" r="5" fill="#0B57D0"/>
        <text x="56" y="222" font-size="16" fill="#1A1C1E">Arızalı</text>
      </g>
      <g id="Calisiyor">
        <circle cx="32" cy="264" r="10" fill="none" stroke="#80868F" stroke-width="2.5"/>
        <text x="56" y="270" font-size="16" fill="#1A1C1E">Çalışıyor</text>
      </g>
      <g id="Bilmiyorum">
        <circle cx="32" cy="312" r="10" fill="none" stroke="#80868F" stroke-width="2.5"/>
        <text x="56" y="318" font-size="16" fill="#1A1C1E">Bilmiyorum</text>
      </g>
    </g>
    <g id="Aciklama">
      <text x="16" y="370" font-size="20" font-weight="600" fill="#1A1C1E">Açıklama (isteğe bağlı)</text>
      <rect x="16" y="384" width="328" height="128" rx="12" fill="#FFFFFF" stroke="#80868F" stroke-width="2"/>
      <text x="32" y="414" font-size="16" fill="#4A5058">Örn. asansör 2. katta durmuyor</text>
      <text x="344" y="536" font-size="14" font-weight="600" fill="#4A5058" text-anchor="end">0 / 500</text>
      <text x="16" y="536" font-size="14" fill="#4A5058">Kişisel bilgi yazmayın.</text>
    </g>
    <g id="Gonder">
      <rect x="16" y="568" width="328" height="48" rx="12" fill="#0B57D0"/>
      <text x="180" y="597" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Gönder</text>
    </g>
    <text x="16" y="648" font-size="14" fill="#4A5058">Bildirim anonimdir. Yönetici onaylamadan</text>
    <text x="16" y="668" font-size="14" fill="#4A5058">noktanın durumu değişmez.</text>
  </g>
  <g id="Gonderim sonrasi" transform="translate(400 0)">
    <rect width="360" height="800" fill="#FFFFFF"/>
    <g id="Baslik">
      <path d="M16 28 L28 16 M16 28 L28 40 M16 28 L40 28" stroke="#1A1C1E" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="56" y="36" font-size="20" font-weight="600" fill="#1A1C1E">Sorun bildir</text>
      <line x1="0" y1="56" x2="360" y2="56" stroke="#80868F"/>
    </g>
    <g id="Basari">
      <rect x="16" y="72" width="328" height="112" rx="12" fill="#FFFFFF" stroke="#1B6E33" stroke-width="2"/>
      <circle cx="44" cy="104" r="14" fill="#1B6E33"/>
      <path d="M37 104 L42 110 L52 98" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="70" y="110" font-size="16" font-weight="700" fill="#1B6E33">Bildiriminiz alındı</text>
      <text x="32" y="142" font-size="16" fill="#1A1C1E">Teşekkürler. Yönetici onayladığında</text>
      <text x="32" y="164" font-size="16" fill="#1A1C1E">nokta güncellenir.</text>
    </g>
    <g id="Hata ornegi">
      <rect x="16" y="208" width="328" height="112" rx="12" fill="#FFFFFF" stroke="#B3261E" stroke-width="2"/>
      <circle cx="44" cy="240" r="14" fill="#B3261E"/>
      <path d="M38 234 L50 246 M50 234 L38 246" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="246" font-size="16" font-weight="700" fill="#B3261E">Gönderilemedi</text>
      <text x="32" y="278" font-size="16" fill="#1A1C1E">Bu nokta için bugün zaten bildirim</text>
      <text x="32" y="300" font-size="16" fill="#1A1C1E">gönderdiniz. Teşekkürler!</text>
    </g>
    <g id="Noktaya don">
      <rect x="16" y="344" width="328" height="48" rx="12" fill="#FFFFFF" stroke="#80868F" stroke-width="2"/>
      <text x="180" y="373" font-size="14" font-weight="600" fill="#1A1C1E" text-anchor="middle">Noktaya dön</text>
    </g>
  </g>
</svg>
