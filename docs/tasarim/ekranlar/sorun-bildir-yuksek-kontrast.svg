<svg xmlns="http://www.w3.org/2000/svg" width="760" height="800" viewBox="0 0 760 800" font-family="Roboto, Arial, sans-serif">
  <title>Sorun bildir (#26) — wireframe, yüksek kontrast tema: form ve gönderim sonrası</title>
  <g id="Form">
    <rect width="360" height="800" fill="#000000"/>
    <g id="Baslik">
      <path d="M16 28 L28 16 M16 28 L28 40 M16 28 L40 28" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="56" y="36" font-size="20" font-weight="600" fill="#FFFFFF">Sorun bildir</text>
      <line x1="0" y1="56" x2="360" y2="56" stroke="#FFFFFF"/>
    </g>
    <g id="Nokta">
      <rect x="16" y="72" width="328" height="72" rx="12" fill="#121212" stroke="#FFFFFF"/>
      <path d="M36 124 L60 96" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="76" y="102" font-size="20" font-weight="600" fill="#FFFFFF">Ana giriş rampası</text>
      <text x="76" y="126" font-size="16" fill="#E0E0E0">Rampa · Teknoloji Fakültesi</text>
    </g>
    <g id="Durum">
      <text x="16" y="182" font-size="20" font-weight="600" fill="#FFFFFF">Durum</text>
      <g id="Arizali (secili)">
        <circle cx="32" cy="216" r="10" fill="none" stroke="#FFD60A" stroke-width="2.5"/>
        <circle cx="32" cy="216" r="5" fill="#FFD60A"/>
        <text x="56" y="222" font-size="16" fill="#FFFFFF">Arızalı</text>
      </g>
      <g id="Calisiyor">
        <circle cx="32" cy="264" r="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
        <text x="56" y="270" font-size="16" fill="#FFFFFF">Çalışıyor</text>
      </g>
      <g id="Bilmiyorum">
        <circle cx="32" cy="312" r="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
        <text x="56" y="318" font-size="16" fill="#FFFFFF">Bilmiyorum</text>
      </g>
    </g>
    <g id="Aciklama">
      <text x="16" y="370" font-size="20" font-weight="600" fill="#FFFFFF">Açıklama (isteğe bağlı)</text>
      <rect x="16" y="384" width="328" height="128" rx="12" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
      <text x="32" y="414" font-size="16" fill="#E0E0E0">Örn. asansör 2. katta durmuyor</text>
      <text x="344" y="536" font-size="14" font-weight="600" fill="#E0E0E0" text-anchor="end">0 / 500</text>
      <text x="16" y="536" font-size="14" fill="#E0E0E0">Kişisel bilgi yazmayın.</text>
    </g>
    <g id="Gonder">
      <rect x="16" y="568" width="328" height="48" rx="12" fill="#FFD60A"/>
      <text x="180" y="597" font-size="14" font-weight="600" fill="#000000" text-anchor="middle">Gönder</text>
    </g>
    <text x="16" y="648" font-size="14" fill="#E0E0E0">Bildirim anonimdir. Yönetici onaylamadan</text>
    <text x="16" y="668" font-size="14" fill="#E0E0E0">noktanın durumu değişmez.</text>
  </g>
  <g id="Gonderim sonrasi" transform="translate(400 0)">
    <rect width="360" height="800" fill="#000000"/>
    <g id="Baslik">
      <path d="M16 28 L28 16 M16 28 L28 40 M16 28 L40 28" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="56" y="36" font-size="20" font-weight="600" fill="#FFFFFF">Sorun bildir</text>
      <line x1="0" y1="56" x2="360" y2="56" stroke="#FFFFFF"/>
    </g>
    <g id="Basari">
      <rect x="16" y="72" width="328" height="112" rx="12" fill="#000000" stroke="#5CE08A" stroke-width="2"/>
      <circle cx="44" cy="104" r="14" fill="#5CE08A"/>
      <path d="M37 104 L42 110 L52 98" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="70" y="110" font-size="16" font-weight="700" fill="#5CE08A">Bildiriminiz alındı</text>
      <text x="32" y="142" font-size="16" fill="#FFFFFF">Teşekkürler. Yönetici onayladığında</text>
      <text x="32" y="164" font-size="16" fill="#FFFFFF">nokta güncellenir.</text>
    </g>
    <g id="Hata ornegi">
      <rect x="16" y="208" width="328" height="112" rx="12" fill="#000000" stroke="#FF8A80" stroke-width="2"/>
      <circle cx="44" cy="240" r="14" fill="#FF8A80"/>
      <path d="M38 234 L50 246 M50 234 L38 246" stroke="#000000" stroke-width="3" stroke-linecap="round"/>
      <text x="70" y="246" font-size="16" font-weight="700" fill="#FF8A80">Gönderilemedi</text>
      <text x="32" y="278" font-size="16" fill="#FFFFFF">Bu nokta için bugün zaten bildirim</text>
      <text x="32" y="300" font-size="16" fill="#FFFFFF">gönderdiniz. Teşekkürler!</text>
    </g>
    <g id="Noktaya don">
      <rect x="16" y="344" width="328" height="48" rx="12" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
      <text x="180" y="373" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Noktaya dön</text>
    </g>
  </g>
</svg>
