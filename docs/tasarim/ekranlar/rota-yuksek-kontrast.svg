<svg xmlns="http://www.w3.org/2000/svg" width="360" height="800" viewBox="0 0 360 800" font-family="Roboto, Arial, sans-serif">
  <title>Basamaksız rota (#25) — wireframe, yüksek kontrast tema</title>
  <g id="Ekran">
    <rect id="Zemin" width="360" height="800" fill="#000000"/>
    <g id="Baslik">
      <rect width="360" height="56" fill="#000000"/>
      <path d="M16 28 L28 16 M16 28 L28 40 M16 28 L40 28" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <text x="56" y="36" font-size="20" font-weight="600" fill="#FFFFFF">Basamaksız rota</text>
      <line x1="0" y1="56" x2="360" y2="56" stroke="#FFFFFF"/>
    </g>
    <g id="Ozet">
      <text x="16" y="92" font-size="20" font-weight="600" fill="#FFFFFF">Ana giriş rampası</text>
      <text x="16" y="116" font-size="14" font-weight="600" fill="#E0E0E0">Basamaksız rota · 320 metre</text>
      <text x="16" y="138" font-size="14" fill="#E0E0E0">Başlangıç: konumunuza en yakın yol</text>
    </g>
    <g id="Harita">
      <rect x="0" y="152" width="360" height="300" fill="#000000"/>
      <rect x="40" y="180" width="110" height="70" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
      <rect x="210" y="300" width="120" height="90" rx="4" fill="#000000" stroke="#FFFFFF" stroke-width="1.5"/>
      <text x="52" y="220" font-size="14" fill="#E0E0E0">Kütüphane</text>
      <text x="222" y="380" font-size="14" fill="#E0E0E0">Teknoloji Fak.</text>
      <polyline id="Rota cizgisi" points="70,420 70,280 180,280 180,330 230,330" fill="none" stroke="#FFD60A" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
      <g id="Baslangic">
        <circle cx="70" cy="420" r="11" fill="#000000" stroke="#FFD60A" stroke-width="4"/>
        <circle cx="70" cy="420" r="4" fill="#FFD60A"/>
      </g>
      <g id="Varis">
        <circle cx="230" cy="330" r="18" fill="#000000" stroke="#5CE08A" stroke-width="3"/>
        <path d="M220 338 L240 322" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      </g>
    </g>
    <g id="Adimlar">
      <text x="16" y="486" font-size="20" font-weight="600" fill="#FFFFFF">Adımlar</text>
      <g id="Adim 1">
        <circle cx="32" cy="524" r="14" fill="#FFD60A"/>
        <text x="32" y="529" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">1</text>
        <text x="56" y="520" font-size="16" fill="#FFFFFF">Bulunduğunuz yerden kuzeye</text>
        <text x="56" y="542" font-size="14" fill="#E0E0E0">140 metre, düz yol</text>
        <line x1="16" y1="558" x2="344" y2="558" stroke="#FFFFFF"/>
      </g>
      <g id="Adim 2">
        <circle cx="32" cy="590" r="14" fill="#FFD60A"/>
        <text x="32" y="595" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">2</text>
        <text x="56" y="586" font-size="16" fill="#FFFFFF">Kütüphane önünden sağa</text>
        <text x="56" y="608" font-size="14" fill="#E0E0E0">110 metre, kılavuz iz var</text>
        <line x1="16" y1="624" x2="344" y2="624" stroke="#FFFFFF"/>
      </g>
      <g id="Adim 3">
        <circle cx="32" cy="656" r="14" fill="#FFD60A"/>
        <text x="32" y="661" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">3</text>
        <text x="56" y="652" font-size="16" fill="#FFFFFF">Rampadan ana girişe</text>
        <text x="56" y="674" font-size="14" fill="#E0E0E0">70 metre, eğim %6,5</text>
        <line x1="16" y1="690" x2="344" y2="690" stroke="#FFFFFF"/>
      </g>
    </g>
    <g id="Yol tarifi al">
      <rect x="16" y="712" width="328" height="48" rx="12" fill="#000000" stroke="#FFFFFF" stroke-width="2"/>
      <text x="180" y="741" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Yol tarifi al (Google Haritalar)</text>
    </g>
  </g>
</svg>
