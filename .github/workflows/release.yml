name: Release APK

# v* tag'i push edilince EAS'te production APK üretilir ve GitHub Releases'a yüklenir
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: EAS build
        run: eas build -p android --profile production --non-interactive --wait --json > build.json
      - name: APK'yı indir
        run: |
          url=$(jq -r '.[0].artifacts.buildUrl' build.json)
          test -n "$url" && test "$url" != "null"
          curl -fL --retry 3 "$url" -o "kampus-erisilebilirlik-${GITHUB_REF_NAME}.apk"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "kampus-erisilebilirlik-${GITHUB_REF_NAME}.apk" \
            --generate-notes --notes-file ../.github/release-notes.md
